name: Generate LeetCode Stats Widget

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Generate LeetCode Stats Widget
        run: |
          python generate_leetcode_stats.py
      
      - name: Upload SVG artifact
        uses: actions/upload-artifact@v4
        with:
          name: leetcode-stats
          path: leetcode_stats.svg
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add leetcode_stats.svg
          git diff --staged --quiet || git commit -m "Update LeetCode stats widget [skip ci]"
          git push
